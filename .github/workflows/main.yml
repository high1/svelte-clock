name: Build and Deploy 🕛
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BASE: /${{ github.event.repository.name }}/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Pnpm 🧱
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Audit 🛡️
        run: pnpm audit

      - name: Install playwright 🌐
        run: pnpm playwright

      - name: Check 🔎
        run: pnpm check

      - name: Lint 🧹
        run: pnpm lint

      - name: Test 🧪
        run: pnpm test

      # getSecondsSinceMidnight reads the wall clock, so the DST handling has
      # to survive transitions in any region and both hemispheres.
      - name: Test across timezones 🌍
        run: |
          for tz in America/New_York Europe/Berlin Australia/Sydney; do
            echo "::group::$tz"
            TZ=$tz pnpm vitest run test/time.svelte.test.ts
            echo "::endgroup::"
          done

      - name: Build 🚧
        run: |
          pnpm build
          touch dist/.nojekyll

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
